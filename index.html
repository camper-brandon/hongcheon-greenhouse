<title>홍천 온실 골조 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #eef0ec; --panel: #ffffff; --ink: #1f2a24; --muted: #5e6b63; --line: #d3d8d1;
    --accent: #b0522b; --accent-ink: #ffffff; --sky: #dfe6e0; --ground: #cfd6cd;
    --chip: #f3f5f1; --focus: #2a6f97; --hi: #b0522b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1b1f1c; --panel: #242926; --ink: #e9ece7; --muted: #a2aba4; --line: #3a413c;
      --accent: #d9784f; --accent-ink: #1b1f1c; --sky: #2a302c; --ground: #1f2421;
      --chip: #2c322e; --focus: #7fb4d3; --hi: #d9784f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1b1f1c; --panel: #242926; --ink: #e9ece7; --muted: #a2aba4; --line: #3a413c;
    --accent: #d9784f; --accent-ink: #1b1f1c; --sky: #2a302c; --ground: #1f2421;
    --chip: #2c322e; --focus: #7fb4d3; --hi: #d9784f;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif; font-size: 14px; overflow: hidden; }
  #app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  header .rev { font-size: 12px; color: var(--muted); }
  header .dims { font-size: 12px; color: var(--muted); margin-left: auto; }
  #stage { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
  .panel { position: absolute; background: color-mix(in srgb, var(--panel) 93%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; backdrop-filter: blur(4px); }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  #left { left: 12px; top: 12px; width: 210px; max-height: calc(100% - 24px); overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .sec { border-top: 1px solid var(--line); padding-top: 8px; }
  .sec:first-child { border-top: 0; padding-top: 0; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label.row .sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.25); flex: none; }
  label.row .cnt { margin-left: auto; font-size: 11px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=search], input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--chip); color: var(--ink); }
  input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .small { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .val { font-size: 12px; }
  .nav { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .nav button { flex: 0 0 auto; padding: 3px 8px; }
  .scap { flex: 1 1 auto; font-size: 12.5px; line-height: 1.3; min-height: 2.6em; }
  .card { font-size: 12px; line-height: 1.35; border-left: 3px solid var(--accent); padding: 4px 8px; margin-top: 6px; min-height: 3.9em; }
  .card .no { color: var(--accent); font-weight: 700; }
  #right { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  #right .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12.5px; padding: 5px 9px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 4px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #tip { position: absolute; pointer-events: none; display: none; padding: 6px 9px; font-size: 12.5px; line-height: 1.4; max-width: 280px; }
  #tip .n, #pin .n { font-weight: 600; }
  #tip .d, #pin .d { font-size: 11.5px; color: var(--muted); }
  #pin { left: 12px; bottom: 12px; max-width: 340px; font-size: 12.5px; line-height: 1.45; }
  #pin:empty { display: none; }
  #help { right: 12px; bottom: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.5; text-align: right; }
  .dl { position: absolute; pointer-events: none; transform: translate(-50%, -50%); font-size: 11.5px; padding: 1px 5px; border-radius: 3px; background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--hi); font-weight: 500; white-space: nowrap; }

  #togL { left: 12px; top: 12px; }
  #togR { right: 12px; top: 12px; }
  #left.hide, #right.hide, #help.hide { display: none; }
  #left { top: 44px; max-height: calc(100% - 56px); }
  #right { top: 44px; }
  @media (max-width: 720px) {
    #left { width: 160px; font-size: 12.5px; }
    #help { display: none; }
    #right { right: 8px; top: 8px; }
    header .dims { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      </div>

  // ── 패널 숨기기 / 보이기 (상태는 이 브라우저에만 기억)
  const PANELS = { L: ['left', 'togL', '◀ 층 · 순서 · 단면', '▶ 층 · 순서 · 단면'], R: ['right', 'togR', '보는 방향 ▶', '보는 방향 ◀'] };

  resize();
